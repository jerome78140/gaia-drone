<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GAIA Drone | Photographie & Vidéo Aérienne Professionnelle |</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2ec5ff;
      --primary-hover: #25a9db;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --transition: all 0.3s ease;
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
      radial-gradient(circle at top left, rgba(46,197,255,0.08), transparent 30%),
      radial-gradient(circle at bottom right, rgba(46,197,255,0.05), transparent 30%),
      #0f172a;
      color: var(--text-light);
      line-height:1.6;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--primary);
      color: #fff;
    }

    /* --- NAVIGATION --- */

    nav {
      position:fixed;
      top:0;
      width:100%;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      padding: 12px 5%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:1000;
      border-bottom: 1px solid rgba(46, 197, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-img {
      height: 45px;
      width: auto;
      border-radius: 4px;
    }

    nav h2 {
      color: var(--text-light);
      font-weight: 800;
      font-size: 1.1rem;
    }
    
    .nav-toggle {
      display: none;
    }

    .nav-menu {
      display:flex;
      list-style:none;
      gap:25px;
    }

    nav a {
      color: var(--text-light);
      text-decoration:none;
      font-weight:500;
      font-size: 0.9rem;
      transition: var(--transition);
      position: relative;
    }

    nav a:hover {
      color: var(--primary);
    }

    nav a::after {
      content:"";
      position:absolute;
      left:0;
      bottom:-6px;
      width:0%;
      height:2px;
      background:var(--primary);
      transition:0.3s;
    }

    nav a:hover::after {
      width:100%;
    }

    /* --- HERO --- */

    header {
      position: relative;
      min-height: 100vh;
      background:
      linear-gradient(rgba(15, 23, 42, 0.2), rgba(15, 23, 42, 0.4)),
      url('DJI_20260515141335_0100_D.JPG') center/cover no-repeat;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding: 100px 20px;
      background-attachment: fixed;
      overflow: hidden;
      animation: heroZoom 18s ease-in-out infinite alternate;
    }

    header::before {
      content:"";
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at center,
      rgba(46,197,255,0.15),
      transparent 60%);
    }

    @keyframes heroZoom {
      from {
        background-size: 100%;
      }
      to {
        background-size: 110%;
      }
    }

    header h1 {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 800;
      margin-bottom:20px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      z-index: 2;
    }

    header h1 span {
      color: var(--primary);
      text-shadow: 0 0 20px rgba(46, 197, 255, 0.4);
    }

    header p {
      max-width: 650px;
      font-size: clamp(1rem, 4vw, 1.2rem);
      margin-bottom: 40px;
      color: #fff;
      z-index: 2;
    }

    .hero-logo {
      width: 150px;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px rgba(46, 197, 255, 0.6));
      animation: fadeIn 1.5s ease-out;
      z-index: 2;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- INTRO --- */

    #intro {
      padding: 80px 10%;
      text-align: center;
    }

    .intro-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .intro-text {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 300;
      line-height: 1.5;
      color: var(--text-light);
    }

    .intro-text span {
      color: var(--primary);
      font-weight: 800;
      letter-spacing: 2px;
    }

    .intro-line {
      width: 60px;
      height: 2px;
      background: var(--primary);
      margin: 30px auto 0;
      opacity: 0.6;
    }

    /* --- SECTIONS --- */

    section {
      padding: 100px 8%;
    }

    .section-title h2 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      text-align: center;
    }

    .underline {
      width: 50px;
      height: 4px;
      background: var(--primary);
      margin: 15px auto 50px;
      box-shadow: 0 0 10px var(--primary);
    }

    /* --- ANIMATIONS --- */

    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      transition: 0.8s ease;
    }

    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- SERVICES --- */

    .services-grid {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap:25px;
    }

    .card {
      position: relative;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      transition: var(--transition);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 15px;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(46,197,255,0.5),
        transparent,
        rgba(46,197,255,0.15)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .card:hover {
      border-color: var(--primary);
      transform: translateY(-8px);
    }

    .video-container {
      width: 100%;
      height: 180px;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    .video-container::after {
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(
        to top,
        rgba(15,23,42,0.65),
        transparent 60%
      );
      pointer-events:none;
    }

    .video-container iframe,
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
    }

    .card-content {
      padding: 25px;
      text-align: center;
    }

    .card h3 {
      color: var(--primary);
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    .card p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* --- GALERIE --- */

    .gallery-grid {
      columns: 3 250px;
      column-gap: 15px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.6s ease, filter 0.6s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
      filter: brightness(1.1);
    }

    /* --- ABOUT --- */

    .about-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 80px;
      align-items: center;
    }

    .about-text {
      padding-right: 15px;
    }

    .about-text h2 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 30px;
      letter-spacing: 1px;
      text-align: center;
    }

    .about-text p {
      font-size: 1.05rem;
      line-height: 2;
      color: #d6e2f0;
      max-width: 700px;
      margin-top: 25px;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
      text-align: justify;
    }

    .about-image img {
      width: 360px;
      height: 360px;
      object-fit: cover;
      object-position: center 35%;
      border-radius: 50%;
      border: 3px solid rgba(46, 197, 255, 0.35);
      box-shadow: 0 0 30px rgba(46, 197, 255, 0.18);
      display: block;
      margin: 0 auto;
      transition: 0.5s ease;
    }

    .about-image img:hover {
      transform: scale(1.03);
      box-shadow: 0 0 40px rgba(46, 197, 255, 0.4);
    }

    .about-image-caption {
      text-align: center;
      margin-top: 15px;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .check-list {
      list-style: none;
      margin-top: 20px;
    }

    .check-list li {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* --- FORMULAIRE --- */

    .contact-form {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid rgba(46, 197, 255, 0.2);
      border-radius: 8px;
      color: white;
      margin-top: 8px;
      font-family: inherit;
      transition: 0.3s ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(46,197,255,0.2);
    }

    /* --- BOUTONS --- */

    .btn {
      display:inline-block;
      padding: 14px 30px;
      background: var(--primary);
      color: var(--bg-dark);
      text-decoration:none;
      border-radius:8px;
      font-weight:700;
      transition: var(--transition);
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.35),
        transparent
      );
      transition: 0.7s;
    }

    .btn:hover::before {
      left: 120%;
    }

    .btn:hover {
      box-shadow: 0 0 20px rgba(46, 197, 255, 0.4);
      filter: brightness(1.1);
    }

    footer {
      padding: 40px;
      text-align: center;
      border-top: 1px solid rgba(46,197,255,0.1);
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
    }

    @media (max-width: 768px) {

      header {
        background-attachment: scroll;
      }

      section {
        padding: 60px 20px;
      }

      .nav-toggle-label {
        display: block;
        cursor: pointer;
        order: 3;
      }

      .nav-toggle-label span,
      .nav-toggle-label span::before,
      .nav-toggle-label span::after {
        display: block;
        background: var(--primary);
        height: 2px;
        width: 25px;
        position: relative;
      }

      .nav-toggle-label span::before {
        content: '';
        position: absolute;
        top: -8px;
      }

      .nav-toggle-label span::after {
        content: '';
        position: absolute;
        top: 8px;
      }

      .nav-menu {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: var(--bg-dark);
        flex-direction: column;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }

      .nav-menu a {
        padding: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }

      .nav-toggle:checked ~ .nav-menu {
        max-height: 400px;
      }

      .about-image img {
        width: 280px;
        height: 280px;
      }
    }

  </style>
</head>
